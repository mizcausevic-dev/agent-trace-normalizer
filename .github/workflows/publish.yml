name: publish

# Publishes to npm via Trusted Publishing (OIDC) — no npm token or OTP
# involved. Requires this exact repo + workflow file to be registered as a
# Trusted Publisher on the npm package's "Publishing access" settings
# (npmjs.com -> package -> Settings -> Trusted Publisher -> GitHub Actions).
# npm CLI >= 11.5.1 auto-detects the GitHub Actions OIDC token when
# id-token: write is granted; nothing else to configure here.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: build, verify, publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Node 22's bundled npm predates full OIDC trusted-publishing support
      # (needs npm >= 11.5.1); the initial rollout of this workflow 404'd on
      # the actual publish PUT even though provenance signing succeeded.
      - run: npm install -g npm@11.5.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - run: npm publish --provenance --access public
